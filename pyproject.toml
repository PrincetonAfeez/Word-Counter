[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "word-counter"
version = "0.1.0"
description = "Streaming-first word counter and text statistics CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Word Counter Contributors" }]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
pdf = ["pypdf>=4"]
dev = [
  "hypothesis>=6",
  "mypy>=1.15",
  "pytest>=8",
  "ruff>=0.11",
]

[project.scripts]
wordcount = "word_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word_counter = ["resources/stopwords/*.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["word_counter"]
